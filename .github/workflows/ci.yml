name: CI — Test, Lint & Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  FLUTTER_VERSION: "3.22.0"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend — Python tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: neuroguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Alembic migrations (test DB)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/neuroguard_test
        run: alembic upgrade head

      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/neuroguard_test
          REDIS_URL: redis://localhost:6379/0
          AUTH0_DOMAIN: test.auth0.com
          AUTH0_AUDIENCE: https://api.test.neuroguard.health
          FIELD_ENCRYPTION_KEY: "dGVzdC1rZXktMzItYnl0ZXMtZm9yLXRlc3Rpbmch"
          JWT_SECRET: test-secret-for-ci
          ENVIRONMENT: test
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-fail-under=80 \
            --tb=short \
            -v \
            --asyncio-mode=auto

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────────────
  # ML — PyTorch model tests
  # ─────────────────────────────────────────────────────────────────────────────
  ml-test:
    name: ML Tests (PyTorch + SHAP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Run ML tests with coverage
        working-directory: ml
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-fail-under=75 \
            --tb=short \
            -v

      - name: Test model forward pass
        run: |
          python -c "
          import torch
          import sys
          sys.path.insert(0, 'ml')
          from models.neuroguard_model import NeuroGuardModel
          model = NeuroGuardModel()
          ks = torch.randn(4, 20)
          sl = torch.randn(4, 15)
          out = model(ks, sl)
          assert out.shape == (4, 1), f'Expected (4,1), got {out.shape}'
          assert (out >= 0).all() and (out <= 1).all(), 'Output not in [0,1]'
          print('Model forward pass: OK')
          "

  # ─────────────────────────────────────────────────────────────────────────────
  # Web — TypeScript + Jest
  # ─────────────────────────────────────────────────────────────────────────────
  web-test:
    name: Web Tests (Next.js + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --frozen-lockfile

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: web
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0

      - name: Run Jest tests with coverage
        working-directory: web
        run: |
          npx jest \
            --coverage \
            --coverageThreshold='{"global":{"lines":70}}' \
            --passWithNoTests \
            --ci

      - name: Build (verify no build errors)
        working-directory: web
        env:
          NEXTAUTH_SECRET: ci-secret-not-real
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Flutter — Dart analyze + tests
  # ─────────────────────────────────────────────────────────────────────────────
  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests with coverage
        working-directory: mobile
        run: flutter test --coverage

      - name: Check coverage threshold
        working-directory: mobile
        run: |
          pip install lcov-cobertura
          lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{if ($2+0 < 75) {print "Coverage below 75%: " $2; exit 1}}'

  # ─────────────────────────────────────────────────────────────────────────────
  # Security — SAST + Container scan
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Bandit + Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit SAST
        run: |
          bandit -r backend/ \
            -x backend/tests \
            -ll \
            --severity-level medium \
            -f json \
            -o bandit-report.json || true
          # Fail on HIGH severity findings
          bandit -r backend/ \
            -x backend/tests \
            --severity-level high \
            -f screen
        continue-on-error: false

      - name: Run Safety (dependency vulnerabilities)
        run: |
          pip install safety
          safety check -r backend/requirements.txt --output screen
        continue-on-error: true

      - name: Trivy — scan filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          format: "table"

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker Build — multi-arch images (only on main/develop)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-test, ml-test, web-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: auth-service
            context: backend
            dockerfile: backend/docker/Dockerfile.backend
            build_args: "SERVICE=auth"
          - name: health-service
            context: backend
            dockerfile: backend/docker/Dockerfile.backend
            build_args: "SERVICE=health"
          - name: risk-service
            context: backend
            dockerfile: backend/docker/Dockerfile.backend
            build_args: "SERVICE=risk"
          - name: alerts-service
            context: backend
            dockerfile: backend/docker/Dockerfile.backend
            build_args: "SERVICE=alerts"
          - name: reports-service
            context: backend
            dockerfile: backend/docker/Dockerfile.backend
            build_args: "SERVICE=reports"
          - name: federated-service
            context: backend
            dockerfile: backend/docker/Dockerfile.backend
            build_args: "SERVICE=federated"
          - name: web-dashboard
            context: web
            dockerfile: web/Dockerfile
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/neuroguard/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ matrix.service.build_args }}
