events { worker_connections 1024; }

http {
  upstream auth_service      { server auth:8001;      }
  upstream user_service      { server user:8002;      }
  upstream health_service    { server health:8003;    }
  upstream risk_service      { server risk:8004;      }
  upstream alerts_service    { server alerts:8005;    }
  upstream reports_service   { server reports:8006;   }
  upstream federated_service { server federated:8007; }

  # Don't rewrite request URI; forward it verbatim to the upstream.
  # This avoids 301 redirects on missing trailing slashes.

  server {
    listen 80;
    server_name _;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Static health check
    location = /api/v1/health/ping {
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }

    # Service routes (regex match handles both /foo and /foo/ uniformly)
    location ~ ^/api/v1/auth(/.*)?$       { proxy_pass http://auth_service;      }
    location ~ ^/api/v1/user(/.*)?$       { proxy_pass http://user_service;      }
    location ~ ^/api/v1/clinician(/.*)?$  { proxy_pass http://user_service;      }
    location ~ ^/api/v1/patients(/.*)?$   { proxy_pass http://user_service;      }
    location ~ ^/api/v1/analytics(/.*)?$  { proxy_pass http://user_service;      }
    location ~ ^/api/v1/health(/.*)?$     { proxy_pass http://health_service;    }
    location ~ ^/api/v1/keystroke(/.*)?$  { proxy_pass http://health_service;    }
    location ~ ^/api/v1/wearable(/.*)?$    { proxy_pass http://health_service;    }
    location ~ ^/api/v1/assessments(/.*)?$ { proxy_pass http://health_service;    }
    location ~ ^/api/v1/risk(/.*)?$       { proxy_pass http://risk_service;      }
    location ~ ^/api/v1/alerts(/.*)?$     { proxy_pass http://alerts_service;    }
    location ~ ^/api/v1/reports(/.*)?$    { proxy_pass http://reports_service;   }
    location ~ ^/api/v1/federated(/.*)?$  { proxy_pass http://federated_service; }
  }
}
