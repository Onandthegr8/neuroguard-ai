---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuroguard-ingress
  namespace: neuroguard
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
    # Rate limiting at ingress level
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-rpm: "300"
spec:
  tls:
    - hosts:
        - api.neuroguard.health
        - app.neuroguard.health
      secretName: neuroguard-tls
  rules:
    # API routes → backend microservices (via nginx sidecar in prod, or direct)
    - host: api.neuroguard.health
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /api/v1/user
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /api/v1/health
            pathType: Prefix
            backend:
              service:
                name: health-service
                port:
                  number: 8003
          - path: /api/v1/keystroke
            pathType: Prefix
            backend:
              service:
                name: health-service
                port:
                  number: 8003
          - path: /api/v1/wearable
            pathType: Prefix
            backend:
              service:
                name: health-service
                port:
                  number: 8003
          - path: /api/v1/risk
            pathType: Prefix
            backend:
              service:
                name: risk-service
                port:
                  number: 8004
          - path: /api/v1/alerts
            pathType: Prefix
            backend:
              service:
                name: alerts-service
                port:
                  number: 8005
          - path: /api/v1/reports
            pathType: Prefix
            backend:
              service:
                name: reports-service
                port:
                  number: 8006
          - path: /api/v1/federated
            pathType: Prefix
            backend:
              service:
                name: federated-service
                port:
                  number: 8007
          - path: /api/v1/clinician
            pathType: Prefix
            backend:
              service:
                name: reports-service
                port:
                  number: 8006
          - path: /api/v1/patients
            pathType: Prefix
            backend:
              service:
                name: reports-service
                port:
                  number: 8006
    # Web dashboard
    - host: app.neuroguard.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-dashboard
                port:
                  number: 3000
---
# ClusterIssuer for Let's Encrypt TLS
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@neuroguard.health
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
